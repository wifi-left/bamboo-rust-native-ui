site_name: Bamboo Native UI（中文）
site_description: 一个小型声明式原生 Windows UI 框架，使用 GDI 与脏矩形渲染。
docs_dir: docs/zh
site_dir: site/zh
use_directory_urls: true

theme:
  variant: modern
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

extra:
  alternate:
    - name: English
      link: ../
      lang: en
    - name: 中文
      link: ./
      lang: zh

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - 首页: index.md
  - 综述:
      - 项目介绍: overview/introduction.md
      - 架构: overview/architecture.md
      - 设计原则: overview/design-principles.md
  - 快速上手:
      - 概览: quickstart/index.md
      - 创建项目: quickstart/01-create-project.md
      - 引入 crate: quickstart/02-add-the-crate.md
      - 第一个窗体: quickstart/03-first-window.md
      - 自定义控件: quickstart/04-custom-widgets.md
      - 运行时 XML: quickstart/05-xml-dynamic.md
      - 编译静态 XML: quickstart/06-xml-compiled.md
      - 布局与断点: quickstart/07-layout-and-breakpoints.md
      - 列表、表格与树: quickstart/08-lists-tables-trees.md
      - 菜单、工具栏与状态栏: quickstart/09-menus-toolbars-status.md
      - 对话框、托盘与热键: quickstart/10-dialogs-tray-hotkeys.md
      - 主题与图像: quickstart/11-theming-and-images.md
      - 文本编辑与输入法: quickstart/12-text-editing-and-ime.md
      - 播放器界面: quickstart/13-player-ui.md
