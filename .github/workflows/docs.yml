name: Docs

on:
  # Build and deploy whenever the documentation or its configuration changes.
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "mkdocs.zh.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"

  # Allows manual runs from the Actions tab.
  workflow_dispatch:

# The Pages artifact deployment needs these permissions.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; let an in-progress production deploy finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install mkdocs
        run: pip install -r requirements-docs.txt

      # English at the site root: site/index.html
      - name: Build English site
        run: mkdocs build --config-file mkdocs.yml

      # Chinese under /zh/: site/zh/index.html (does not remove the English build)
      - name: Build Chinese site
        if: ${{ hashFiles('docs/zh/index.md') != '' }}
        run: mkdocs build --config-file mkdocs.zh.yml

      # Pages must not hand the artifact to Jekyll.
      - name: Disable Jekyll
        run: touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
