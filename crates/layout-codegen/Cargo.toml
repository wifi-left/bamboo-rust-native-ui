[package]
name = "bamboo-native-ui-layout-codegen"
description = "Turns a Bamboo Native UI `.buixml` layout into plain Rust (compiled mode)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bamboo-native-ui-layout-codegen"
path = "src/main.rs"

[dependencies]
# The generated code targets `bamboo-native-ui` itself; this crate only reads
# the document, so it needs the core's parser and never the window crate.
bamboo-native-ui-layout-core = { path = "../layout-core", features = ["parse"] }
